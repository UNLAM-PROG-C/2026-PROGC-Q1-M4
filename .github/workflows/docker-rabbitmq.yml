name: Build & Push RabbitMQ

on:
  push:
    branches: [main, develop]
    paths:
      - "TP-Integrador/rabbitmq/**"
      - ".github/workflows/docker-rabbitmq.yml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./TP-Integrador/rabbitmq
          file: ./TP-Integrador/rabbitmq/Dockerfile.rabbitmq
          push: true
          tags: |
            holitest/tp-integrador-rabbitmq:latest
            holitest/tp-integrador-rabbitmq:${{ github.sha }}
