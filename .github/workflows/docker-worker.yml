name: Build & Push Worker

on:
  push:
    branches: [main, develop]
    paths:
      - "TP-Integrador/worker/**"
      - ".github/workflows/docker-worker.yml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./TP-Integrador/worker
          file: ./TP-Integrador/worker/Dockerfile.worker
          push: true
          tags: |
            holitest/tp-integrador-worker:latest
            holitest/tp-integrador-worker:${{ github.sha }}
