services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    develop:
      watch:
        - action: sync+restart
          path: ./frontend/index.html
          target: /usr/share/nginx/html/index.html
    ports:
      - "8080:80"
    # depends_on:
    #   backend:
    #     condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    volumes:
      - ./ipc:/ipc:rw
    ports:
      - "3001:3001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    develop:
      watch:
        - action: sync+restart
          path: ./worker
          target: /app
          ignore:
            - __pycache__/
            - .venv/
            - .git/
    restart: unless-stopped
    volumes:
      - ./ipc:/ipc:rw
