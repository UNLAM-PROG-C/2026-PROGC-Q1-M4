# k8s/worker-scaledjob.yaml
#
# KEDA ScaledJob para el worker Python.
#
# Flujo:
#   1. Backend publica bytes de imagen en "image_queue".
#   2. KEDA detecta el mensaje y levanta un Job (1 Job por mensaje).
#   3. El Pod lee la imagen, genera 4 labels con probabilidades aleatorias
#      y publica el resultado JSON en "result_queue".
#   4. El backend (publishAndWait) lee result_queue y responde al frontend.
#
# ── Solución Windows / Docker Desktop ───────────────────────────────────────
#   Los pods de k8s NO están en la red docker del compose.
#   Docker Desktop inyecta "host.docker.internal" en todos los pods,
#   que resuelve a la IP de la máquina host.
#   RabbitMQ expone el puerto 30672 en el host (ver docker-compose.yml),
#   por eso tanto los pods como el TriggerAuthentication usan ese puerto.
# ────────────────────────────────────────────────────────────────────────────
 
---
# Secret con la URL AMQP que usa KEDA para conectarse a RabbitMQ
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secret
  namespace: tp-integrador
type: Opaque
stringData:
  # host.docker.internal:30672 → llega al contenedor rabbitmq en el host
  host: "amqp://admin:admin@host.docker.internal:30672/"
 
---
# TriggerAuthentication: le dice a KEDA cómo autenticarse con RabbitMQ
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: rabbitmq-auth
  namespace: tp-integrador
spec:
  secretTargetRef:
    - parameter: host
      name: rabbitmq-secret
      key: host
 
---
# ScaledJob: crea un Job de k8s por cada mensaje en image_queue
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: worker
  namespace: tp-integrador
spec:
 
  # ── Política de escalado ──────────────────────────────────────────────────
  pollingInterval: 5          # KEDA revisa la cola cada 5 segundos
  maxReplicaCount: 10         # máximo de Jobs paralelos
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
 
  # ── Trigger: escala cuando hay mensajes en image_queue ───────────────────
  triggers:
    - type: rabbitmq
      metadata:
        protocol: amqp
        queueName: image_queue
        mode: QueueLength
        value: "1"            # 1 Job por cada mensaje pendiente
      authenticationRef:
        name: rabbitmq-auth
 
  # ── Template del Job ──────────────────────────────────────────────────────
  jobTargetRef:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: worker
        spec:
          restartPolicy: Never
          containers:
            - name: worker
              image: francovallejos885/tp-concurrente-worker:v1.0
              imagePullPolicy: Always
              env:
                - name: RABBITMQ_HOST
                  value: "host.docker.internal"
                - name: RABBITMQ_PORT
                  value: "30672"
                - name: RABBITMQ_USER
                  value: "admin"
                - name: RABBITMQ_PASS
                  value: "admin"
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "256Mi"